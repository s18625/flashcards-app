name: Deploy do GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Zainstaluj zależności
        run: npm ci

      - name: Testy jednostkowe
        run: npm test

      - name: Build produkcyjny (z base path dla GitHub Pages)
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Przygotuj artefakt Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publikacja
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wdróż na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
